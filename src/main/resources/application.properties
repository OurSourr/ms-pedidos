spring.application.name=ms-pedidos
# Puerto de tu microservicio
server.port=8080
spring.application.name=ms-pedidos

# Conexión a MySQL (createDatabaseIfNotExist=true crea la BD automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/ms_pedidos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect